name: demo

# The hosted demo at https://rubesworld.github.io/devfeed/: the page plus made-up
# data. Rebuilt daily so its timestamps stay relative to today.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the demo site
        run: |
          mkdir site
          cp public/index.html site/
          python -c "import json, devfeed; json.dump(devfeed.demo_feed(), open('site/feed.json', 'w'))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
